name: Piinpoint
description: >-
  PiinPoint is an AI-powered location intelligence and site selection platform for retailers,
  restaurants, brokers, and commercial real estate teams. The software combines demographic,
  mobile-location, traffic, and competitive data to help teams validate sites, forecast sales,
  model cannibalization, run network simulations, and plan expansion. Delivered as a B2B SaaS
  web application (app.piinpoint.com), PiinPoint does not currently publish a public developer
  API, developer portal, or SDK. This profile was surfaced as a Y Combinator portfolio company
  and enriched by the API Evangelist pipeline.
